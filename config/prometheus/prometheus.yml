global:
  scrape_interval: 15s

scrape_configs:
  # Spring Boot apps running on the developer machine (MacBook via Tailscale).
  # The DEV_MACHINE_IP is set in .env — update it when you change dev machines.
  - job_name: 'ai-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          env: 'ai-lab'

  # Host-level metrics (CPU, RAM, disk, network) via node-exporter.
  # Uses Docker DNS — no external port needed.
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          env: 'ai-lab'
          instance: 'ai-lab-host'

  # Per-container metrics (CPU, memory, network per container) via cAdvisor.
  # Uses Docker DNS — no external port needed.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          env: 'ai-lab'
          instance: 'ai-lab-host'
