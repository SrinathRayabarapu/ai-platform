global:
  scrape_interval: 15s

scrape_configs:
  # Spring Boot actuator metrics. Targets come from file_sd so you can change
  # the dev machine (Tailscale IP vs same-host) without editing this file —
  # run: ./scripts/render-prometheus-config.sh (called automatically from bootstrap).
  - job_name: 'ai-services'
    metrics_path: '/actuator/prometheus'
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/ai-services.json
        refresh_interval: 15s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          env: 'ai-lab'
          instance: 'ai-lab-host'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          env: 'ai-lab'
          instance: 'ai-lab-host'
